---
layout: default
---

<main class="journal-post-page">

  <a class="journal-home" href="{{ '/journal.html' | relative_url }}">
    ☾ Back to Journal
  </a>

  <article class="journal-full-entry">

    <time>
      {{ page.date | date: "%B %-d, %Y" }}
    </time>

    <h1 class="journal-title">{{ page.title }}</h1>

    <div class="journal-entry-content"
         style="text-align: {{ page.text_alignment | default: 'justify' }};
                font-family: '{{ page.font_family | default: 'Cormorant Garamond' }}', serif;
                font-size: {{ page.font_size | default: 21 }}px;
                line-height: {{ page.line_height | default: 1.85 }};
                --post-paragraph-gap: {{ page.paragraph_spacing | default: 28 }}px;">
      {{ content }}
    </div>

  </article>

  <div class="journal-divider">✧</div>

</main>
