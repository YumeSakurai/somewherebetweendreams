
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Somewhere Between Dreams</title>

  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #080808;
      color: #d8d0c8;
      font-family: 'Cormorant Garamond', serif;
    }

    .gallery-page {
      width: min(1100px, 90%);
      margin: auto;
      padding: 65px 0;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 65px;
    }

    .gallery-header h1 {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(55px, 9vw, 90px);
      font-weight: normal;
      margin-bottom: 10px;
    }

    .gallery-header p {
      font-size: 18px;
      font-style: italic;
      letter-spacing: .08em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .gallery-grid img {
      display: block;
      width: 100%;
      height: 350px;
      object-fit: contain;
      padding: 8px;
      border: 1px solid rgba(190,170,150,.25);
      background: rgba(255,255,255,.02);
    }

    .gallery-home {
      display: block;
      text-align: center;
      margin-top: 65px;
      color: #c9b9a8;
      text-decoration: none;
      font-style: italic;
    }

    @media (max-width: 700px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .gallery-grid img {
        height: 220px;
      }
    }

    @media (max-width: 400px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-grid img {
        height: auto;
        max-height: 400px;
      }
    }
  </style>
</head>

<body>

  <main class="gallery-page">

  <header class="gallery-header">
  <h1>Gallery</h1>

  <img
    class="gallery-featured-image"
    src="the-muse.png"
    alt="The Muse">

  <p>A collection of pictures and inspirations</p>
</header>

      <!-- Add your images here -->

    </section>

    <a class="gallery-home" href="index.html">✧ Return home ✧</a>

  </main>

</body>
</html>
