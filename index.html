<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="A personal journal of writing, poetry, photographs and dreams inspired by my muse.">

  <title>Somewhere Between Dreams</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <!-- HEADER: decorations only, no navigation -->
    <header class="site-header">
      <a class="wordmark" href="#home" aria-label="Home">☾</a>
      <span class="header-star" aria-hidden="true">✧</span>
    </header>


    <!-- HOMEPAGE INTRODUCTION -->
    <section class="hero" id="home">

      <div class="title-ornament" aria-hidden="true">
        <span>☾</span>
        <i>✦</i>
        <span>✧</span>
      </div>

      <h1>Somewhere Between Dreams</h1>

      <div class="title-ornament lower" aria-hidden="true">
        <span>✧</span>
        <i>✦</i>
        <span>☽</span>
      </div>

      <figure class="moon-cat">
        <img
          src="moon-cat.png"
          alt="Gothic illustration of a crescent moon and a black cat">
      </figure>

      <p class="intro">
        A personal journal of writing, poetry, photographs and dreams inspired by my muse.
      </p>

      <div class="ornamental-divider" aria-hidden="true">
        <span>✦</span>
      </div>


      <!-- THE ONLY NAVIGATION PANEL -->
      <nav class="section-links" aria-label="Journal sections">

        <a href="#journal">
          <span class="link-symbol">☽</span>
          Journal
        </a>

        <a href="images.html" target="_blank" rel="noopener noreferrer">
          <span class="link-symbol">❀</span>
          Images
        </a>

        <a href="who-i-am.html" target="_blank" rel="noopener noreferrer">
          <span class="link-symbol">☽</span>
          Who I am
        </a>

      </nav>

    </section>


    <!-- THE MUSE -->
    <section class="muse-section">

      <h2 id="muse-title">The Muse</h2>

      <div class="muse-frame">

        <span class="frame-star star-one" aria-hidden="true">✧</span>

        <img
          src="NEW-MUSE-IMAGE.jpg"
          alt="A photograph of my muse">

        <span class="frame-star star-two" aria-hidden="true">✦</span>

      </div>

    </section>


    <!-- RECENTLY WRITTEN -->
    <section class="recently-written-section" id="journal">

      <h2 class="recently-written-title">
        ☾ Recently Written ☽
      </h2>

      <!-- Your published posts can be added here -->

    </section>


    <!-- FOOTER -->
    <footer class="site-footer">

      <span>☾</span>

      <p>Somewhere Between Dreams</p>

      <small>
        ✦ &nbsp; made of words, shadows and stardust &nbsp; ✦
      </small>

    </footer>

  </main>

</body>
</html>
